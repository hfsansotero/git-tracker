name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Unit tests
        run: for f in tests/test_*.py; do python "$f"; done
      - name: End to end against the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git-tracker collect "${{ github.repository_owner }}" -o snapshot.json
          for animal in animals/*/; do
            name=$(basename "$animal")
            git-tracker render snapshot.json "$animal" -o "out/$name"
            git-tracker preview "$animal"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gifs
          path: out/**/*.gif
